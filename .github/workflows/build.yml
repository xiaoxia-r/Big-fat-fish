
name: Build Blue Mermaid Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blue_mermaid_android_project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app source
        run: |
          unzip -q blue_mermaid_android_project.zip
          test -f BlueMermaidAndroid/app/build.gradle

      
      - name: Show Kotlin source around error
        working-directory: BlueMermaidAndroid
        run: |
          nl -ba app/src/main/java/com/example/bluemermaid/PetOverlayService.kt | sed -n '160,175p'


      - name: Align Java and Kotlin JVM targets
        working-directory: BlueMermaidAndroid
        run: |

          sed -i 's/buildMenu(dp)/buildMenu { n ->   dp(n) }/' app/src/main/java/com/example/bluemermaid/PetOverlayService.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          if not re.search(r'\bandroid\s*\{', s):
              raise SystemExit("找不到 android 配置块")

          if "compileOptions" not in s:
              s = re.sub(
                  r'\bandroid\s*\{',
                  lambda m: m.group(0) + """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r'(sourceCompatibility\s+)JavaVersion\.VERSION_1_8',
                  r'\1JavaVersion.VERSION_17',
                  s
              )
              s = re.sub(
                  r'(targetCompatibility\s+)JavaVersion\.VERSION_1_8',
                  r'\1JavaVersion.VERSION_17',
                  s
              )

          p.write_text(s)
          print("已更新 Java 编译目标")
          PY
      - name: Build debug APK
        working-directory: BlueMermaidAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-mermaid-debug-apk
          path: BlueMermaidAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
