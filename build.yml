name: Build Blue Mermaid Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'blue_mermaid_android_project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract app source
        run: |
          unzip -q blue_mermaid_android_project.zip
          test -f BlueMermaidAndroid/app/build.gradle
      - name: Build debug APK
        working-directory: BlueMermaidAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-mermaid-debug-apk
          path: BlueMermaidAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
